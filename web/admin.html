<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración OPT1</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-body"><header class="topbar"><div><span class="eyebrow">IES MANUEL MARTÍN GONZÁLEZ</span><h1>Panel docente OPT1</h1></div><button id="logout" class="ghost" hidden>Cerrar sesión</button></header><main class="admin-main"><section id="connect" class="admin-card"><h2>Conexión con el servidor</h2><label>Dirección de la API<input id="apiUrl" type="url" placeholder="https://opt1.example.org"></label><button id="connectBtn" class="primary">Conectar</button><p id="connectFeedback" class="feedback"></p></section><section id="setup" class="admin-card" hidden><h2>Crear administrador inicial</h2><p>Esta pantalla solo aparece durante la primera instalación.</p><form id="setupForm"><label>Usuario<input name="username" minlength="3" required></label><label>Contraseña segura<input name="password" type="password" minlength="10" required></label><button class="primary">Crear administrador</button></form><p class="feedback"></p></section><section id="login" class="admin-card" hidden><h2>Acceso docente</h2><form id="adminLogin"><label>Usuario<input name="username" required></label><label>Contraseña<input name="password" type="password" required></label><button class="primary">Entrar</button></form><p class="feedback"></p></section><section id="dashboard" hidden><div class="admin-actions"><div><h2>Seguimiento del alumnado</h2><p id="summary"></p></div><div><button id="refresh" class="primary">Actualizar</button><button id="export" class="secondary">Exportar CSV</button></div></div><div class="filters"><label>Buscar<input id="search" placeholder="Nombre, código o grupo"></label><label>Grupo<select id="groupFilter"><option value="">Todos</option></select></label><label>Estado<select id="statusFilter"><option value="">Todos</option><option value="passed">Superado</option><option value="failed">No superado</option><option value="incomplete">En curso</option><option value="none">Sin iniciar</option></select></label></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Código</th><th>Alumno</th><th>Grupo</th><th>Progreso</th><th>Estado</th><th>Última conexión</th><th>Acción</th></tr></thead><tbody id="students"></tbody></table></div></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
